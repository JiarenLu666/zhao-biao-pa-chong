[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiangsu-tender-monitor"
version = "0.1.0"
description = "江苏摄影、文旅与文化类采购公告采集与提醒工具"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
tender-monitor = "tender_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
